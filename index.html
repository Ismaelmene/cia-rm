<script>
/* =========================================================================
   CONFIGURAÇÃO DO FIREBASE
   >>> SUBSTITUA os valores abaixo pelas chaves do SEU projeto Firebase <<<
   Console Firebase > Configurações do projeto > Seus apps > app Web
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCjnaVyJNA78kja27oeUjW1CldgDfFoty8",
  authDomain: "ciarm-cdf8e.firebaseapp.com",
  projectId: "ciarm-cdf8e",
  storageBucket: "ciarm-cdf8e.firebasestorage.app",
  messagingSenderId: "1054682050190",
  appId: "1:1054682050190:web:d19e280e944947026923df"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* =========================================================================
   ESTADO GLOBAL
   ========================================================================= */
const state = {
  user: null,
  usuarioNome: '',
  currentSection: 'dashboard',
  currentAnimalId: null,
  currentEventoId: null,
  usuarios: [],
  animais: [],
  despesas: [],
  receitas: [],
  eventos: [],
  fretes: [],
  veiculos: [],
  equipamentos: [],
  outrosBens: [],
  arenaConfig: { valorEstimadoTotal: 0, dataInicio: '', previsaoConclusao: '', status: 'Planejado' },
  unsubscribers: []
};

const CATEGORIAS_DESPESA_ANIMAL = ['Alimentação','Vacina','Medicamento','Veterinário','Tratamento','Frete','Exame','Manutenção','Outros'];
const CATEGORIAS_DESPESA_GERAL = ['Animais','Alimentação','Vacina','Medicamento','Veterinário','Tratamento','Frete','Transporte','Combustível','Funcionários','Equipamentos','Manutenção','Arena','Eventos','Documentação','Outros'];
const CATEGORIAS_RECEITA = ['Cachê','Evento','Patrocínio','Venda de animal','Aluguel','Outros'];
const CATEGORIAS_ARENA = ['Terreno','Estrutura','Arquibancada','Bretes','Curral','Alambrado','Iluminação','Instalação elétrica','Banheiros','Cobertura','Sonorização','Bilheteria','Escritório','Equipamentos','Mão de obra','Material','Outros'];
const PRODUTOS_ALIMENTACAO = ['Ração','Sal mineral','Feno','Silagem','Suplementação','Outros'];
const STATUS_ANIMAL = ['Ativo','Vendido','Aposentado','Falecido','Outro'];
const STATUS_EVENTO = ['Planejado','Confirmado','Realizado','Cancelado'];

/* =========================================================================
   UTILITÁRIOS
   ========================================================================= */
function fmtMoeda(v) {
  v = Number(v) || 0;
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function fmtData(d) {
  if (!d) return '—';
  const dt = typeof d === 'string' ? new Date(d + 'T00:00:00') : d;
  if (isNaN(dt.getTime())) return '—';
  return dt.toLocaleDateString('pt-BR');
}
function hoje() { return new Date().toISOString().slice(0,10); }
function mesAno(dataStr) { return (dataStr || '').slice(0,7); }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = 'fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-4 py-2 rounded-lg text-sm font-semibold shadow-lg ' + (isError ? 'bg-red-600 text-white' : 'bg-zinc-900 text-white');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}
function resizeImageFile(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxSize) { h = h * (maxSize / w); w = maxSize; }
      else if (h > maxSize) { w = w * (maxSize / h); h = maxSize; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* =========================================================================
   MODAL GENÉRICO
   ========================================================================= */
function openModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalContainer').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modalContainer').classList.add('hidden');
  document.getElementById('modalBody').innerHTML = '';
}

/* =========================================================================
   AUTENTICAÇÃO
   ========================================================================= */
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  auth.signInWithEmailAndPassword(email, senha)
    .catch(err => {
      let msg = 'Não foi possível entrar. Verifique e-mail e senha.';
      if (err.code === 'auth/invalid-email') msg = 'E-mail inválido.';
      if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'E-mail ou senha incorretos.';
      if (err.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Tente novamente em instantes.';
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    })
    .finally(() => { btn.disabled = false; btn.textContent = 'Entrar'; });
});

function logout() {
  auth.signOut();
}

auth.onAuthStateChanged(async function(user) {
  if (user) {
    state.user = user;
    await carregarUsuario(user);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('headerUser').textContent = state.usuarioNome + ' · ' + user.email;
    iniciarListeners();
    showSection('dashboard');
  } else {
    state.user = null;
    state.unsubscribers.forEach(u => u());
    state.unsubscribers = [];
    document.getElementById('appScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('loginForm').reset();
  }
});

async function carregarUsuario(user) {
  const ref = db.collection('usuarios').doc(user.uid);
  const snap = await ref.get();
  if (snap.exists && snap.data().nome) {
    state.usuarioNome = snap.data().nome;
  } else {
    let nome = prompt('Bem-vindo! Como podemos te chamar (nome do sócio)?', user.displayName || user.email.split('@')[0]);
    if (!nome) nome = user.email.split('@')[0];
    await ref.set({ nome: nome, email: user.email }, { merge: true });
    state.usuarioNome = nome;
  }
}

/* =========================================================================
   NAVEGAÇÃO
   ========================================================================= */
const TITULOS_SECAO = {
  dashboard: 'Dashboard', animais: 'Animais', 'animal-ficha': 'Ficha do Animal',
  financeiro: 'Financeiro', eventos: 'Eventos', 'evento-detalhe': 'Evento',
  arena: 'Arena', patrimonio: 'Patrimônio', relatorios: 'Relatórios', config: 'Configurações'
};

function showSection(id) {
  state.currentSection = id;
  document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
  document.getElementById('section-' + id).classList.remove('hidden');
  document.getElementById('headerTitle').textContent = TITULOS_SECAO[id] || '';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === id));
  window.scrollTo(0,0);
  renderSection(id);
}

function renderSection(id) {
  if (id === 'dashboard') renderDashboard();
  else if (id === 'animais') renderAnimaisList();
  else if (id === 'animal-ficha') renderAnimalFicha(state.currentAnimalId);
  else if (id === 'financeiro') renderFinanceiro();
  else if (id === 'eventos') renderEventosList();
  else if (id === 'evento-detalhe') renderEventoDetalhe(state.currentEventoId);
  else if (id === 'arena') renderArena();
  else if (id === 'patrimonio') renderPatrimonio();
  else if (id === 'relatorios') renderRelatorios();
  else if (id === 'config') renderConfig();
}

function refreshAll() {
  renderSection(state.currentSection);
}

/* =========================================================================
   LISTENERS FIRESTORE (tempo real)
   ========================================================================= */
function iniciarListeners() {
  const subs = [
    db.collection('animais').onSnapshot(snap => { state.animais = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('despesas').onSnapshot(snap => { state.despesas = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('receitas').onSnapshot(snap => { state.receitas = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('eventos').onSnapshot(snap => { state.eventos = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('fretes').onSnapshot(snap => { state.fretes = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('veiculos').onSnapshot(snap => { state.veiculos = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('equipamentos').onSnapshot(snap => { state.equipamentos = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('outrosBens').onSnapshot(snap => { state.outrosBens = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener),
    db.collection('config').doc('arena').onSnapshot(snap => { if (snap.exists) state.arenaConfig = snap.data(); refreshAll(); }, erroListener),
    db.collection('usuarios').onSnapshot(snap => { state.usuarios = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshAll(); }, erroListener)
  ];
  state.unsubscribers = subs;
}
function erroListener(err) { console.error(err); toast('Erro ao carregar dados. Verifique a configuração do Firebase.', true); }

/* =========================================================================
   CÁLCULOS AUTOMÁTICOS
   ========================================================================= */
function despesasDoAnimal(animalId) {
  return state.despesas.filter(d => d.animalId === animalId);
}
function custoTotalAnimal(animal) {
  const despesas = despesasDoAnimal(animal.id).reduce((s, d) => s + num(d.valorTotal), 0);
  return num(animal.valorCompra) + despesas;
}
function valorPesoAnimal(animal) {
  return num(animal.arrobas) * num(animal.cotacaoArroba);
}
function valorMercadoAnimal(animal) {
  return num(animal.valorMercadoRodeio);
}
function valorizacaoPesoAnimal(animal) {
  return valorPesoAnimal(animal) - custoTotalAnimal(animal);
}
function lucroPotencialAnimal(animal) {
  return valorMercadoAnimal(animal) - custoTotalAnimal(animal);
}
function percentualValorizacaoAnimal(animal) {
  const custo = custoTotalAnimal(animal);
  if (custo <= 0) return 0;
  return (lucroPotencialAnimal(animal) / custo) * 100;
}
function statusValorizacaoAnimal(animal) {
  const pct = percentualValorizacaoAnimal(animal);
  if (pct > 5) return { cor: '🟢', label: 'Valorizando', classe: 'bg-green-100 text-green-700' };
  if (pct < -5) return { cor: '🔴', label: 'Desvalorizando', classe: 'bg-red-100 text-red-700' };
  return { cor: '🟡', label: 'Estável', classe: 'bg-amber-100 text-amber-700' };
}

function totalReceitas(filterFn) {
  return state.receitas.filter(filterFn || (() => true)).reduce((s, r) => s + num(r.valor), 0);
}
function totalDespesas(filterFn) {
  return state.despesas.filter(filterFn || (() => true)).reduce((s, d) => s + num(d.valorTotal), 0);
}
function saldoAtual() {
  return totalReceitas() - totalDespesas();
}

function totalInvestidoArena() {
  return state.despesas.filter(d => d.categoria === 'Arena').reduce((s, d) => s + num(d.valorPago !== undefined && d.valorPago !== '' ? d.valorPago : d.valorTotal), 0);
}
function totalPrevistoArena() {
  return num(state.arenaConfig.valorEstimadoTotal);
}
function percentualConclusaoArena() {
  const prev = totalPrevistoArena();
  if (prev <= 0) return 0;
  return Math.min(100, (totalInvestidoArena() / prev) * 100);
}

function valorTotalAnimais() {
  return state.animais.filter(a => a.status === 'Ativo' || !a.status).reduce((s, a) => s + valorMercadoAnimal(a), 0);
}
function valorTotalVeiculos() {
  return state.veiculos.reduce((s, v) => s + num(v.valorAtualEstimado), 0);
}
function valorTotalEquipamentos() {
  return state.equipamentos.reduce((s, e) => s + num(e.valorAtualEstimado), 0);
}
function valorTotalOutrosBens() {
  return state.outrosBens.reduce((s, o) => s + num(o.valor), 0);
}
function patrimonioTotal() {
  return valorTotalAnimais() + valorTotalVeiculos() + valorTotalEquipamentos() + totalInvestidoArena() + valorTotalOutrosBens();
}

function custosDoEvento(eventoId) {
  return state.despesas.filter(d => d.eventoId === eventoId);
}
function totalCustosEvento(eventoId) {
  return custosDoEvento(eventoId).reduce((s, d) => s + num(d.valorTotal), 0);
}
function receitaEvento(evento) {
  return num(evento.valorCache);
}
function lucroEvento(evento) {
  return receitaEvento(evento) - totalCustosEvento(evento.id);
}

/* =========================================================================
   CRUD GENÉRICO DE DESPESAS (usado por Animais, Financeiro, Eventos e Arena
   — um único lançamento alimenta automaticamente todas as visões,
   evitando duplicidade, conforme o princípio do sistema)
   ========================================================================= */
async function salvarDespesa(dados, idExistente) {
  dados.usuarioId = state.user.uid;
  dados.usuarioNome = state.usuarioNome;
  dados.atualizadoEm = firebase.firestore.FieldValue.serverTimestamp();
  if (idExistente) {
    await db.collection('despesas').doc(idExistente).update(dados);
  } else {
    dados.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('despesas').add(dados);
  }
}
async function excluirDespesa(id) {
  if (!confirm('Excluir este lançamento? Essa ação não pode ser desfeita.')) return;
  await db.collection('despesas').doc(id).delete();
  toast('Lançamento excluído.');
}

function abrirFormDespesa(contexto, vinculoId, despesaExistente) {
  const isEdit = !!despesaExistente;
  const d = despesaExistente || {};
  let categorias;
  if (contexto === 'animal') categorias = CATEGORIAS_DESPESA_ANIMAL;
  else if (contexto === 'evento') categorias = ['Transporte','Combustível','Hospedagem','Alimentação','Funcionários','Taxas','Equipamentos','Outros'];
  else if (contexto === 'arena') categorias = CATEGORIAS_ARENA;
  else categorias = CATEGORIAS_DESPESA_GERAL;

  const animalOptions = state.animais.map(a => `<option value="${a.id}" ${d.animalId===a.id?'selected':''}>${escapeHtml(a.nome)}</option>`).join('');

  const html = `
    <form id="formDespesa" class="space-y-3">
      <div>
        <label class="label-field">Data</label>
        <input type="date" name="data" class="input-field" value="${d.data || hoje()}" required />
      </div>
      <div>
        <label class="label-field">Categoria</label>
        <select name="categoria" id="despCategoria" class="input-field" onchange="atualizarCamposExtrasDespesa()" required>
          ${categorias.map(c => `<option value="${c}" ${(contexto==='arena'?d.arenaCategoria:d.categoria)===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      ${contexto === 'geral' ? `
      <div>
        <label class="label-field">Animal relacionado (opcional)</label>
        <select name="animalId" class="input-field"><option value="">Nenhum</option>${animalOptions}</select>
      </div>` : ''}
      <div>
        <label class="label-field">Descrição</label>
        <input type="text" name="descricao" class="input-field" value="${escapeHtml(d.descricao||'')}" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="label-field">Produto/Serviço</label>
          <input type="text" name="produtoServico" class="input-field" value="${escapeHtml(d.produtoServico||'')}" />
        </div>
        <div>
          <label class="label-field">Fornecedor</label>
          <input type="text" name="fornecedor" class="input-field" value="${escapeHtml(d.fornecedor||'')}" />
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div>
          <label class="label-field">Quantidade</label>
          <input type="number" step="0.01" name="quantidade" id="despQtd" class="input-field" value="${d.quantidade||''}" oninput="calcularValorTotalDespesa()" />
        </div>
        <div>
          <label class="label-field">Unidade</label>
          <input type="text" name="unidade" class="input-field" value="${escapeHtml(d.unidade||'')}" placeholder="kg, un..." />
        </div>
        <div>
          <label class="label-field">Vl. unitário</label>
          <input type="number" step="0.01" name="valorUnitario" id="despUnit" class="input-field" value="${d.valorUnitario||''}" oninput="calcularValorTotalDespesa()" />
        </div>
      </div>
      <div id="arenaExtraFields" class="grid grid-cols-2 gap-3 ${contexto==='arena'?'':'hidden'}">
        <div>
          <label class="label-field">Valor previsto</label>
          <input type="number" step="0.01" name="valorPrevisto" class="input-field" value="${d.valorPrevisto||''}" />
        </div>
        <div>
          <label class="label-field">Status</label>
          <select name="statusArena" class="input-field">
            <option ${d.statusArena==='Previsto'?'selected':''}>Previsto</option>
            <option ${d.statusArena==='Pago'?'selected':''}>Pago</option>
          </select>
        </div>
      </div>
      <div id="vacinaExtraFields" class="grid grid-cols-2 gap-3 hidden">
        <div><label class="label-field">Fabricante</label><input type="text" name="fabricante" class="input-field" value="${escapeHtml(d.fabricante||'')}" /></div>
        <div><label class="label-field">Lote</label><input type="text" name="lote" class="input-field" value="${escapeHtml(d.lote||'')}" /></div>
        <div class="col-span-2"><label class="label-field">Próxima aplicação</label><input type="date" name="proximaAplicacao" class="input-field" value="${d.proximaAplicacao||''}" /></div>
      </div>
      <div id="medExtraFields" class="grid grid-cols-2 gap-3 hidden">
        <div><label class="label-field">Motivo</label><input type="text" name="motivo" class="input-field" value="${escapeHtml(d.motivo||'')}" /></div>
        <div><label class="label-field">Veterinário/Responsável</label><input type="text" name="veterinarioResponsavel" class="input-field" value="${escapeHtml(d.veterinarioResponsavel||'')}" /></div>
      </div>
      <div>
        <label class="label-field">Valor total (R$)</label>
        <input type="number" step="0.01" name="valorTotal" id="despTotal" class="input-field font-bold" value="${d.valorTotal||''}" required />
      </div>
      <div>
        <label class="label-field">Observação</label>
        <textarea name="observacao" class="input-field" rows="2">${escapeHtml(d.observacao||'')}</textarea>
      </div>
      <div class="flex gap-2 pt-2">
        ${isEdit ? `<button type="button" class="btn-danger" onclick="excluirDespesa('${despesaExistente.id}');closeModal();">Excluir</button>` : ''}
        <button type="submit" class="btn-primary flex-1">${isEdit ? 'Salvar alterações' : 'Adicionar despesa'}</button>
      </div>
    </form>
  `;
  openModal(isEdit ? 'Editar lançamento' : 'Adicionar despesa', html);
  setTimeout(atualizarCamposExtrasDespesa, 0);

  document.getElementById('formDespesa').addEventListener('submit', async function(e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const dados = Object.fromEntries(fd.entries());
    dados.quantidade = dados.quantidade ? num(dados.quantidade) : null;
    dados.valorUnitario = dados.valorUnitario ? num(dados.valorUnitario) : null;
    dados.valorTotal = num(dados.valorTotal);
    if (dados.valorPrevisto !== undefined) dados.valorPrevisto = dados.valorPrevisto ? num(dados.valorPrevisto) : null;
    if (contexto === 'animal') dados.animalId = vinculoId;
    if (contexto === 'evento') dados.eventoId = vinculoId;
    if (contexto === 'arena') {
      dados.arenaCategoria = dados.categoria;
      dados.categoria = 'Arena';
      dados.valorPago = dados.statusArena === 'Pago' ? dados.valorTotal : 0;
    } else {
      delete dados.statusArena;
      delete dados.valorPrevisto;
    }
    if (!dados.animalId) dados.animalId = null;
    if (!dados.eventoId) dados.eventoId = null;
    try {
      await salvarDespesa(dados, isEdit ? despesaExistente.id : null);
      toast('Lançamento salvo com sucesso.');
      closeModal();
    } catch (err) { console.error(err); toast('Erro ao salvar: ' + err.message, true); }
  });
}
function calcularValorTotalDespesa() {
  const qtd = num(document.getElementById('despQtd').value);
  const unit = num(document.getElementById('despUnit').value);
  if (qtd && unit) document.getElementById('despTotal').value = (qtd * unit).toFixed(2);
}
function atualizarCamposExtrasDespesa() {
  const cat = document.getElementById('despCategoria').value;
  const vacina = document.getElementById('vacinaExtraFields');
  const med = document.getElementById('medExtraFields');
  if (vacina) vacina.classList.toggle('hidden', cat !== 'Vacina');
  if (med) med.classList.toggle('hidden', !['Medicamento','Veterinário','Tratamento'].includes(cat));
}

async function excluirAnimal(id) {

function abrirFormFrete() {
  const animalCheckboxes = state.animais.map(a => `
    <label class="flex items-center gap-2 text-sm py-1">
      <input type="checkbox" name="animaisIds" value="${a.id}" class="rounded" /> ${escapeHtml(a.nome)}
    </label>
  `).join('');
  openModal('Registrar frete', `
    <form id="formFrete" class="space-y-3">
      <div><label class="label-field">Data</label><input type="date" name="data" class="input-field" value="${hoje()}" required /></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="label-field">Origem</label><input type="text" name="origem" class="input-field" /></div>
        <div><label class="label-field">Destino</label><input type="text" name="destino" class="input-field" /></div>
      </div>
      <div><label class="label-field">Motorista/Transportador</label><input type="text" name="motorista" class="input-field" /></div>
      <div><label class="label-field">Valor total do frete (R$)</label><input type="number" step="0.01" name="valorTotal" class="input-field" required /></div>
      <div>
        <label class="label-field">Animais transportados (o valor será dividido igualmente)</label>
        <div class="max-h-32 overflow-y-auto border rounded-lg px-2">${animalCheckboxes || '<p class="text-xs text-zinc-400 py-2">Nenhum animal cadastrado.</p>'}</div>
      </div>
      <div><label class="label-field">Observação</label><textarea name="observacao" class="input-field" rows="2"></textarea></div>
      <button type="submit" class="btn-primary w-full">Registrar frete</button>
    </form>
  `);
  document.getElementById('formFrete').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const animaisIds = fd.getAll('animaisIds');
    const valorTotal = num(fd.get('valorTotal'));
    const freteDados = {
      data: fd.get('data'), origem: fd.get('origem'), destino: fd.get('destino'),
      motorista: fd.get('motorista'), valorTotal, observacao: fd.get('observacao'),
      animaisIds, usuarioId: state.user.uid, usuarioNome: state.usuarioNome,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    };
    try {
      const freteRef = await db.collection('fretes').add(freteDados);
      const batch = db.batch();
      if (animaisIds.length) {
        const valorPorAnimal = valorTotal / animaisIds.length;
        animaisIds.forEach(animalId => {
          const ref = db.collection('despesas').doc();
          batch.set(ref, {
            data: freteDados.data, categoria: 'Frete', animalId, eventoId: null,
            descricao: `Frete: ${freteDados.origem||'?'} → ${freteDados.destino||'?'}`,
            valorTotal: valorPorAnimal, freteId: freteRef.id,
            usuarioId: state.user.uid, usuarioNome: state.usuarioNome,
            criadoEm: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
      } else {
        const ref = db.collection('despesas').doc();
        batch.set(ref, {
          data: freteDados.data, categoria: 'Transporte', animalId: null, eventoId: null,
          descricao: `Frete: ${freteDados.origem||'?'} → ${freteDados.destino||'?'}`,
          valorTotal, freteId: freteRef.id,
          usuarioId: state.user.uid, usuarioNome: state.usuarioNome,
          criadoEm: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      await batch.commit();
      toast('Frete registrado e custo dividido automaticamente.'); closeModal();
    } catch (err) { console.error(err); toast('Erro ao registrar frete: ' + err.message, true); }
  });
}

      else { fd.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); const ref = await db.collection('eventos').add(fd); eventoId = ref.id; }
      // Mantém uma receita vinculada ao evento sincronizada automaticamente (sem duplicidade de lançamento)
      const receitaExistente = state.receitas.find(r => r.eventoId === eventoId && r.autoGerada);
      const receitaDados = { data: fd.data, descricao: fd.nome, categoria: 'Evento', valor: fd.valorCache, eventoId, autoGerada: true, usuarioId: state.user.uid, usuarioNome: state.usuarioNome };
      if (receitaExistente) await db.collection('receitas').doc(receitaExistente.id).update(receitaDados);
      else { receitaDados.criadoEm = firebase.firestore.FieldValue.serverTimestamp(); await db.collection('receitas').add(receitaDados); }
      toast('Evento salvo com sucesso.'); closeModal();
    } catch (err) { console.error(err); toast('Erro ao salvar: ' + err.message, true); }
  });
}
async function excluirEvento(id) {
  if (!confirm('Excluir este evento, seus custos e a receita vinculada?')) return;
  const batch = db.batch();
  batch.delete(db.collection('eventos').doc(id));
  custosDoEvento(id).forEach(d => batch.delete(db.collection('despesas').doc(d.id)));
  state.receitas.filter(r => r.eventoId === id).forEach(r => batch.delete(db.collection('receitas').doc(r.id)));
  await batch.commit();
  toast('Evento excluído.'); closeModal(); showSection('eventos');
}

  const f = state.relatorioFiltro;

    if (!dataStr) return false;
    if (dataStr.slice(0,4) !== f.ano) return false;
    if (f.mes && dataStr.slice(5,7) !== f.mes) return false;

        <table class="w-full text-xs whitespace-nowrap">
          <thead><tr class="text-zinc-400 text-left border-b"><th class="py-1 pr-2">Evento</th><th class="pr-2">Data</th><th class="pr-2">Status</th><th class="pr-2">Receita</th><th class="pr-2">Custos</th><th>Lucro</th></tr></thead>
          <tbody>${linhas || '<tr><td colspan="6" class="py-4 text-center text-zinc-400">Nenhum evento no período.</td></tr>'}</tbody>
        </table>
      </div>`;
  }

  else if (f.tipo === 'arena') {
    const porCategoria = {};
    state.despesas.filter(d => d.categoria === 'Arena').forEach(d => { const c = d.arenaCategoria||d.categoria; porCategoria[c] = (porCategoria[c]||0) + num(d.valorTotal); });
    el.innerHTML = `
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="stat-tile"><p class="text-xs text-zinc-500">Previsto</p><p class="font-bold">${fmtMoeda(totalPrevistoArena())}</p></div>
        <div class="stat-tile"><p class="text-xs text-zinc-500">Investido</p><p class="font-bold">${fmtMoeda(totalInvestidoArena())}</p></div>
        <div class="stat-tile"><p class="text-xs text-zinc-500">Saldo</p><p class="font-bold">${fmtMoeda(Math.max(0,totalPrevistoArena()-totalInvestidoArena()))}</p></div>
        <div class="stat-tile"><p class="text-xs text-zinc-500">Conclusão</p><p class="font-bold">${percentualConclusaoArena().toFixed(1)}%</p></div>
      </div>
      <h3 class="font-bold text-sm text-zinc-500 mb-2">GASTOS POR CATEGORIA</h3>
      <div class="grid grid-cols-2 gap-2">
        ${Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).map(([c,v]) => `<div class="stat-tile"><p class="text-[11px] text-zinc-500">${escapeHtml(c)}</p><p class="font-bold text-sm">${fmtMoeda(v)}</p></div>`).join('') || '<p class="text-zinc-400 text-sm col-span-2 text-center py-3">Sem investimentos registrados.</p>'}
      </div>`;
  }

  else if (f.tipo === 'patrimonial') {
    el.innerHTML = `
      <div class="stat-tile bg-amber-700 text-white mb-4">
        <p class="text-xs opacity-80">Patrimônio total</p>
        <p class="text-2xl font-bold">${fmtMoeda(patrimonioTotal())}</p>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="stat-tile"><p class="text-xs text-zinc-500">Animais</p><p class="font-bold">${fmtMoeda(valorTotalAnimais())}</p></div>
        <div class="stat-tile"><p class="text-xs text-zinc-500">Veículos</p><p class="font-bold">${fmtMoeda(valorTotalVeiculos())}</p></div>
        <div class="stat-tile"><p class="text-xs text-zinc-500">Equipamentos</p><p class="font-bold">${fmtMoeda(valorTotalEquipamentos())}</p></div>
        <div class="stat-tile"><p class="text-xs text-zinc-500">Arena</p><p class="font-bold">${fmtMoeda(totalInvestidoArena())}</p></div>
        <div class="stat-tile col-span-2"><p class="text-xs text-zinc-500">Outros bens</p><p class="font-bold">${fmtMoeda(valorTotalOutrosBens())}</p></div>
      </div>`;
  }
}

/* =========================================================================
   CONFIGURAÇÕES
   ========================================================================= */
function renderConfig() {
  document.getElementById('section-config').innerHTML = `
    <h2 class="font-bold text-lg mb-4">⚙️ Configurações</h2>
    <div class="card p-4 mb-4">
      <p class="text-xs text-zinc-500 mb-2">Meu perfil</p>
      <p class="font-bold">${escapeHtml(state.usuarioNome)}</p>
      <p class="text-xs text-zinc-400">${escapeHtml(state.user.email)}</p>
      <button onclick="editarMeuNome()" class="text-xs font-semibold text-amber-700 mt-2">Editar nome</button>
    </div>
    <div class="card p-4 mb-4">
      <p class="text-xs text-zinc-500 mb-2">Sócios com acesso</p>
      ${state.usuarios.length ? state.usuarios.map(u => `
        <div class="flex justify-between items-center py-1.5 border-b border-zinc-50 last:border-0">
          <p class="text-sm font-semibold">${escapeHtml(u.nome)}</p>
          <p class="text-xs text-zinc-400">${escapeHtml(u.email)}</p>
        </div>
      `).join('') : '<p class="text-xs text-zinc-400">Nenhum sócio identificado ainda.</p>'}
      <p class="text-[11px] text-zinc-400 mt-3">Para dar acesso a um novo sócio, crie o usuário em Firebase Authentication (e-mail/senha) — ele aparecerá aqui após o primeiro login.</p>
    </div>
    <button onclick="logout()" class="btn-danger w-full">Sair da conta</button>
    <p class="text-center text-[11px] text-zinc-400 mt-6">Gestão da Companhia de Rodeio · v1.0</p>
  `;
}
function editarMeuNome() {
  const novoNome = prompt('Seu nome:', state.usuarioNome);
  if (!novoNome) return;
  db.collection('usuarios').doc(state.user.uid).set({ nome: novoNome, email: state.user.email }, { merge: true })
    .then(() => { state.usuarioNome = novoNome; document.getElementById('headerUser').textContent = novoNome + ' · ' + state.user.email; toast('Nome atualizado.'); renderConfig(); });
}
